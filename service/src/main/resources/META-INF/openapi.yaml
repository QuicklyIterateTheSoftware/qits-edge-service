# The edge's own two API operations (qits-1926).
#
# Every other request the edge takes is proxied to the service its Host names, and that service's own
# document describes it. These two are not: they are Vert.x routes the edge answers itself, on EVERY
# vhost and ahead of the proxy (NavigationRoute, UpstreamPoolsRoute), so no annotation can describe
# them and SmallRye scans nothing here (mp.openapi.scan.disable). This file is merged into the
# document as it is; docs/openapi.yml is its committed copy (OpenApiSchemaExportTest), and the
# operationIds are the ones golden-masters/index.json records them under.
#
# Both routes also answer HEAD with the same headers and no body. Only GET is declared: HEAD is the
# protocol's, not an operation a caller is written against.
#
# The answer depends on the Host the request is asked on — the environment it names, and the
# project the origins are composed for — so a server URL is deliberately not stated.
openapi: 3.1.0
paths:
  /main-navigation:
    get:
      operationId: getMainNavigation
      summary: The platform navigation of the environment the Host names, from the active deployment projection.
      description: >-
        Anonymous. Every slot of the closed vocabulary is present, empty ones included; a slot is an
        array, and one application may fill several of its entries. An origin is null on a name that
        is inside no project (the apex, an address literal), because an application address needs a
        project label. A caller the service gate would admit — a valid bearer or basic credential, or
        a live qits-session cookie while the browser gate is on — also gets, on the public edge, each
        private application that declared a host, as an applications entry with exposure "private";
        a missing, refused or uncheckable credential only leaves those entries out.
      security:
        - {}
        - bearer: []
        - basic: []
        - session: []
      responses:
        "200":
          description: The navigation document. Cache-Control is no-store.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MainNavigation" }
        "503":
          description: >-
            The deployment projection is not authoritative yet (an edge that is still catching up),
            so an incomplete list is not answered as a 200. Retry-After says when to ask again; the
            body is empty.
          headers:
            Retry-After: { schema: { type: integer } }
  /upstream-pools:
    get:
      operationId: getUpstreamPools
      summary: How full each of the edge's two proxy pools is to each upstream origin, and what holds the connections.
      description: >-
        Answered only to a caller the edge would let through to a service: a valid bearer (or basic)
        credential in Authorization, checked exactly as on a service vhost, or a live qits-session
        cookie while the browser session gate is on. One entry per pool and origin holding at least
        one open connection, sorted fullest first (then by origin, then by pool). open minus the
        length of held is the origin's idle connections.
      security:
        - bearer: []
        - basic: []
        - session: []
      responses:
        "200":
          description: The pools document. Cache-Control is no-store.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UpstreamPool" }
        "401":
          description: >-
            No admitted credential: none at all, or one the edge refuses. WWW-Authenticate is Bearer,
            and the body is a plain-text sentence.
          headers:
            WWW-Authenticate: { schema: { type: string } }
        "503":
          description: >-
            The identity provider could not be reached to vouch for the credential — a check that
            cannot be made is not a verdict. Retry-After is set; the body is the docker-style
            {"errors":[{"code":"UNAVAILABLE","message","detail":null}]} envelope.
          headers:
            Retry-After: { schema: { type: integer } }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
    basic:
      type: http
      scheme: basic
    session:
      type: apiKey
      in: cookie
      name: qits-session
  schemas:
    MainNavigation:
      type: object
      required: [environment, origin, projectOrigin, slots, applications]
      properties:
        environment:
          type: string
          description: The environment the Host names.
        origin:
          type: string
          description: The environment's door, which names it and serves nothing else.
        projectOrigin:
          type: string
          description: The origin a per-project application name is built on — prefix <app>. onto its authority.
        slots:
          type: object
          description: >-
            One array per slot of the closed vocabulary (system, platform, project.detail,
            services.details, daemons.details, libs.details, apps.details, frontends.details,
            cli.details, images.details), each sorted by position, then label, then application.
          additionalProperties:
            type: array
            items: { $ref: "#/components/schemas/NavigationEntry" }
        applications:
          type: object
          description: >-
            Keyed by application name: every application that published a host or an api-docs path.
          additionalProperties: { $ref: "#/components/schemas/NavigationApplication" }
    NavigationEntry:
      type: object
      required: [app, label, host, origin, path, position, subpath]
      properties:
        app: { type: string }
        label: { type: string }
        host:
          type: [string, "null"]
          description: The application's published host label; null for none.
        origin:
          type: [string, "null"]
          description: Where the entry is served; null on a name that is inside no project.
        path:
          type: string
          description: The application's primary route.
        position: { type: integer }
        subpath:
          type: [string, "null"]
          description: The view the entry opens, relative to the scope the shell composes; null is the application's root.
    NavigationApplication:
      type: object
      properties:
        origin:
          type: [string, "null"]
          description: The application's own name as an origin; present when it published a host, null on a name inside no project.
        apiDocs:
          type: string
          description: The application's api-docs path, served on its own origin; present when it published one.
        exposure:
          type: string
          enum: [private]
          description: >-
            Present only on a private application the public edge does not route, listed to an
            admitted caller alone; reachable through the private edge (the tunnel). Absent on every
            public and both entry.
    UpstreamPool:
      type: object
      required: [name, environment, origin, pool, open, max, held]
      properties:
        name:
          type: string
          description: Whose the origin is — the application a deployment published it for, the platform app grid, or the wire alias read as <env>-<application>.
        environment:
          type: [string, "null"]
          description: The owner's environment; null when not even the wire alias reads.
        origin:
          type: string
          description: The upstream origin, host:port.
        pool:
          type: string
          enum: [ordinary, stream]
        open:
          type: integer
          description: Connections this pool holds open to the origin, idle or leased.
        max:
          type: integer
          description: This pool's configured size.
        held:
          type: array
          description: One entry per leased connection, oldest first.
          items: { $ref: "#/components/schemas/UpstreamLease" }
    UpstreamLease:
      type: object
      required: [method, path, ageMs, client, userAgent, workspaceId, traceId]
      properties:
        method: { type: string }
        path:
          type: string
          description: The exchange's path, without its query string.
        ageMs:
          type: integer
          description: How long the exchange has held the connection.
        client: { type: [string, "null"] }
        userAgent: { type: [string, "null"] }
        workspaceId: { type: [string, "null"] }
        traceId: { type: [string, "null"] }
