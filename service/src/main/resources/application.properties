# qits-platform-edge — the platform's L7 edge.
# It binds the host's only published port and routes every service on its own name. The
# environment's own name is a door: GET / goes to the projects host and nothing else is served.
# See README.md.

# THE ONLY PUBLISHED LISTENER ON THE HOST. Bind on all interfaces: the process runs in a container
# and is reached from outside it. The deployer publishes it with `-p 8080:8080`.
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# The edge is now the OUTERMOST hop, so this ceiling is the first one every upload meets — ahead of
# the identical one in qits-gateway. Quarkus installs the check as a Vert.x route at order -2, well
# before this process' catch-all, so a body it rejects never selects an environment.
#
# 1088M is qits-artifacts' own layer ceiling, and it is now spelled in THREE repositories: here,
# qits-gateway, and qits-artifacts. `docker push` sends one layer as ONE request body, so the
# smallest of the three is the real limit. Raise it there without raising it here and every large
# layer 413s at the front door with an EMPTY body — which is how you tell this rejection from the
# registry's, whose 413 carries a {"errors":[…]} envelope.
#
# What it does NOT bound is a CHUNKED request: Quarkus compares Content-Length and, with none, only
# stashes the limit for a body reader — and this process reads no bodies at all.
quarkus.http.limits.max-body-size=1088M

# Long-lived exchanges pass through here and are most of the point: workspace terminal sockets, SSE
# event channels, `git clone` of a big repository, HMR websockets. The default 60s read timeout
# would sever every one of them.
quarkus.http.idle-timeout=1H

# The edge's own surface, never proxied (EdgeRouter skips this prefix explicitly):
#   /q/health/live   — the process is up
#   /q/health/ready  — deployment-projection readiness
# This prefix is the one thing that never leaves the process.
quarkus.http.non-application-root-path=/q

# --- the stated domain, which is ONE fact -----------------------------------------------------------
# Every composed name in this process is built from it and none of them is configured beside it: the
# grammar every Host is read right-to-left against, the certificate the edge orders, the authorities
# a login may return to, and the canonical origin (`https://qits.<domain>` — the platform project's
# own door, derived, see EdgeSessions.canonicalOrigin).
#
# IT IS THE ESTATE'S FACT, NOT THIS SERVICE'S, so it is read under the platform's own spelling:
# qits-deployments writes QITS_DOMAIN into every container beside QITS_ENVIRONMENT, and the line
# below maps it onto this key. A deployment states it once, there, and nothing here restates it.
#
# IT CANNOT BE DERIVED from a host name — example.co.uk is two labels of domain and localhost is one
# — which is the whole reason it is stated. It used to be stated twice more, as
# QITS_EDGE_ACME_DOMAIN and as the host of QITS_EDGE_SESSIONS_CANONICAL_ORIGIN, and the second made
# the arrow point backwards: the origin was derived from the domain and the domain from the origin.
# Both keys are gone; a residue variable on a running container is read by nothing.
#
# The default is the local domain, so a clone with no environment at all serves *.localhost:8080.
qits.edge.domain=${QITS_DOMAIN:localhost}

# --- the environments -----------------------------------------------------------------------------
# The whole routing surface. There are FOUR served spellings and every one of them states its
# environment:
#
#   $env.$domain                 prod.example.com             -> prod's DOOR, which serves nothing
#   $app.$env.$domain            registry.prod.example.com    -> prod's registry (see the apps below)
#   $project.$env.$domain        acme.prod.example.com        -> the acme project's door in prod
#   $app.$project.$env.$domain   editor.acme.prod.example.com -> the editor, for acme, in prod
#
#   the apex                     example.com                  -> the default environment's door
#   an IP, localhost, no Host    127.0.0.1, localhost         -> the default environment's door
#
# THE DOOR SERVES NOTHING. Every service is on its own name, so the environment's own name routes no
# path at all. It answers GET / with a 302 to qits-projects' host, so a visitor typing it lands on
# the login through the host that owns it, and 404s everything else. A project's own name is a door
# of the same kind. /q and /main-navigation are the edge's own two surfaces, answered before it.
#
# THE ENVIRONMENT LABEL IS NOT OPTIONAL ANY MORE. registry.example.com used to be the default
# environment's registry, because the apex is that environment's door. The project tier ended it:
# editor.acme.example.com and editor.acme.prod.example.com would be one place whose middle label
# means two different things, and acme.example.com would be a project door or an application vhost
# depending on which set a label happened to be in. So a name of more than one label that does NOT
# state its environment is answered 404 naming the spelling that works — no redirect, because a
# short name is a bookmark or a hard-coded string and each of those wants fixing. The apex itself is
# the one exception, and it is the stated domain above that tells it apart from a service name with
# its label left out.
#
# THE PROJECT LABELS COME FROM THE LOG, not from configuration: qits-projects' ProjectCreated /
# ProjectDeleted frames fill the edge_project projection, and that set is what makes a middle label
# a project. While that projection is still catching up, a name whose reading needs a slug it may
# not have yet is answered 503 with Retry-After rather than a 404 pointing at the wrong name.
#
# The navigation document writes one origin per environment and every one carries its label
# (https://prod.example.com, https://ci.prod.example.com) whichever spelling the request used; a
# one-label apex such as dev.localhost:8080 keeps its environment too, because `localhost` alone
# names every environment at once.
#
# Only the first THREE labels are read; everything to the right of them is the stated domain above —
# see HostEnvironments for why, and for the tie-break when an application shares a name with an
# environment or with a project.
#
# A deployment names the list without a file:
#   QITS_EDGE_ENVIRONMENTS=prod,dev
#   QITS_EDGE_DEFAULT_ENVIRONMENT=prod
#
# The default MUST be a member of the list. It is not a nicety: every unmatched host goes there, so
# a default outside the list cannot resolve a deployment endpoint, so startup fails rather than
# letting each request find out.
qits.edge.environments=prod
qits.edge.default-environment=prod

# --- deployment routing projection ---------------------------------------------------------------
# qits-deployments publishes each successful deployment's resolved endpoints through qits-events.
# The edge consumes that durable log and stores the active snapshot here. This is a separate
# resource from qits-eventstream's claim ledger: a projection can be rebuilt, while the ledger is
# the consumer's delivery bookkeeping.
quarkus.datasource.edge.db-kind=postgresql
quarkus.datasource.edge.jdbc.url=${QITS_RESOURCE_EDGE_URL}
quarkus.datasource.edge.username=${QITS_RESOURCE_EDGE_USERNAME}
quarkus.datasource.edge.password=${QITS_RESOURCE_EDGE_PASSWORD}
quarkus.flyway.edge.migrate-at-start=true
quarkus.flyway.edge.locations=classpath:db/edge/migration

# The edge is not ready just because its local snapshot exists. Its startup coordinator asks the
# durable DeploymentActive consumer to read through an explicit qits-events head and only then
# enables direct endpoint routing and edge-owned navigation. The generic eventstream startup sweep
# stays off here so this named, readiness-owning coordinator is the one startup path; scheduled
# sweeps remain enabled for ordinary recovery after boot.
qits.eventstream.catchup-at-startup=false
qits.edge.projection.catchup.required=true
qits.edge.projection.catchup.retry=PT1S

# WHERE QITS-EVENTS IS IS NOT SPELLED HERE, deliberately, and it is not configuration either.
# `qits.events.url` ships as `http://${QITS_ENVIRONMENT:dev}-qits-events:8080` from the qits-eventstream jar's
# META-INF/microprofile-config.properties at ordinal 100 — the same arrangement qits-ci,
# qits-projects, qits-deployments and every other consumer states in their own files — and a copy in
# this file would be a second place to change and a silent way for the two to drift.
#
# There is nothing for a deployment to decide about it. The jar's default DERIVES the tier —
# `http://${QITS_ENVIRONMENT:dev}-qits-events:8080`, and QITS_ENVIRONMENT is injected into every
# container by qits-deployments — so an environment variable carrying that address would only
# respell what the process already knows. It was one until this release, and removing it changes no
# value: a host-run stack that publishes qits-events on a mapped localhost port can still override
# the key by environment, which is what the override is for.
#
# It used to be spelled bare, and the reason is worth keeping because it is the reason the plane
# existed: qits-events was a PLATFORM service, one process for the whole estate answering at its
# application name from every environment at once. That plane is deleted — it is an ordinary
# environment application in the one tier — so the alias carries `<env>-` like every other.

# --- the applications behind an $app label ---------------------------------------------------------
# An entry here is what turns `registry.dev.localhost` into `dev`'s registry. The shape is a host
# pattern where `{env}` stands in for the
# environment the name carried, a port, and per-environment overrides for what a pattern cannot say.
#
# A NAME REACHES A SERVICE TWO WAYS NOW, and this is the CONFIGURED one: the machine vhosts, and the
# auth attributes that go with them — the audience pattern, the anonymous reads, and /token, which is
# the docker realm and exists only on a configured entry. The other way is the deployment
# projection: a service publishes the name it answers to (`browserHost`) and that name then serves
# its SPA at / and every route it owns. The two are the same kind of vhost from here on.
#
# WHERE THEY MEET, THEY MUST AGREE. `registry` is a configured entry AND the name qits-artifacts
# publishes. The edge treats them as one service exactly when the pattern below resolves to the
# address the deployment published; a frame that says otherwise is refused whole and this entry is
# kept. So an entry here is never taken over by a deployment, and never silently duplicated either.
#
#   qits.edge.apps.<app>.host-pattern       required; `{env}` is the only placeholder
#   qits.edge.apps.<app>.port               default 8080
#   qits.edge.apps.<app>.hosts.<env>        override, `host` or `host:port`
#   qits.edge.apps.<app>.audience-pattern   default `qits-platform`; an app such as githost or the
#                                            editor can name its own resource audience instead
#
# `{env}` is why the environment label still matters on these names: one entry serves every tier —
# registry.dev.localhost reaches dev-qits-artifacts and registry.prod.localhost reaches
# prod-qits-artifacts. It used to be the difference between two KINDS of upstream, because a
# PLATFORM service named no placeholder — there was one process of it for the whole host. That plane
# is deleted and there is one kind left, so every entry carries it.
#
# NEARLY EMPTY HERE, and the emptiness is the rule rather than the habit: a Map entry cannot be
# UNSET by a later config source, only overridden, so an app shipped in this file is an app no
# deployment could take away — and each one is a direct public name. An ENVIRONMENT's application
# therefore stays out, because which tiers exist and which of them publish a machine vhost is a
# deployment's decision and has to remain revocable. A deployment names those without a file:
#
#   QITS_EDGE_APPS_REGISTRY_HOST_PATTERN={env}-qits-artifacts
#   QITS_EDGE_APPS_GITHOST_HOST_PATTERN={env}-qits-githost
#
# `mirror` IS SHIPPED, because it is the one case where irrevocable is correct. There is no
# deployment that could want this label pointed anywhere else: the pull-through cache is the
# platform's own, one per tier, and a tier that ran a different one would not be this platform.
# Spelled as configuration it was never a decision — it was a literal string held in a second place,
# where a typo would be discovered as a 502 on every `docker pull` through the pull-through.
#
# NOTE THE SPELLING, WHICH IS THE POINT OF THE ENTRY. `{env}` here is the EDGE's OWN placeholder,
# substituted per request in EdgeRouter.appUpstream from the environment the Host name named — it is
# not Quarkus property expansion, so `${QITS_ENVIRONMENT:dev}` would be resolved once at startup and
# would name a tier rather than the requested one.
#
# EVERY app names the placeholder now. There used to be a second kind that did not: a platform
# service was one process for the whole estate, addressed bare, and the substitution was a no-op
# over it. The plane is deleted — the mirror is an ordinary service in the one environment,
# addressed `<env>-<application>` like every other — so the pattern carries the placeholder and
# there is no longer a spelling for it to be an exception to.
qits.edge.apps.mirror.host-pattern={env}-qits-platform-mirror
#
# An app label that neither this map nor the projection claims is a 404. An unknown environment label
# still resolves to the default, whose active endpoints decide the path.
#
# ON A SERVICE'S OWN NAME, ANOTHER APPLICATION'S PRIMARY ROUTE IS STILL ROUTED TO IT: /projects/api,
# /workspaces/container and /ci/api work from every host, which is what keeps a dozen SPAs
# same-origin with no CORS anywhere. The primary route is the segment an application is KNOWN by, so
# it means the same thing on everybody's name.
#
# ITS OTHER ROUTES DO NOT TRAVEL. /v2, /git and /bootstrap-git are wire protocols several services
# legitimately answer — the registry and the pull-through mirror both speak /v2 — and only one of
# them can own a path in a projection whose paths are unique per environment. Routing it everywhere
# would send mirror.dev/v2/ at the registry. So a secondary route falls through to the service whose
# name it is, like any unmatched path, and is reached on its OWNER's name — the only place it now
# exists. A bare `/` never travels either, whoever declared it.

# In dev mode the environment gateway is a local process on its own port, not a container on
# qits-net. Keep the address out of this tracked file: put it in .env, which is the per-machine
# mechanism the platform's services use.
%dev.quarkus.http.port=8100

# --- authentication: idp, terminated HERE ----------------------------------------------------------
# The edge is the first node. It sees every request before anything else and already reads the Host
# header, so it is the right and cheapest place to gate — and the application vhosts above front
# services that have no external auth of their own.
#
# ONE KEY NAMES THE RECEIVER, the same rule as qits.observability.url below: the paths under it
# (/jwks, /token) are qits-platform-idp's own and are derived in Idp.java rather than configured, so
# they cannot drift from the issuer. The value is also the `iss` every accepted token must carry,
# exactly. idp derives the same two paths from the same string in its own Issuer class.
#
# QITS_RESOURCE_IDP_URL is read FIRST: the address of the `idp:client` resource a deployment may
# declare for this service (service-client-identity-plan.md, C4/D6/D7). QITS_IDP_URL is the older
# spelling and still works unchanged for as long as no such resource is declared.
qits.idp.url=${QITS_RESOURCE_IDP_URL:${QITS_IDP_URL:http://qits-platform-idp:8080/idp}}

# TWO KEYS NOW, BECAUSE THEY ARE TWO FACTS — see Idp.java for the whole of the reasoning. The key
# above is the `iss` claim, a string that is COMPARED and does not have to resolve. This one is the
# address this process CONNECTS to for /jwks, /token, /api/sessions/introspect and
# /api/tokens/introspect.
#
# THE ENVIRONMENT IS PART OF THE ADDRESS, AND THE SERVICE ALREADY KNOWS IT. Deleting the platform
# plane moves the idp from its bare alias to ${QITS_ENVIRONMENT}-qits-platform-idp, and
# QITS_ENVIRONMENT is injected into every container by qits-deployments — so the dial address is
# derived while the issuer string stays exactly where it is. Moving the issuer instead would reject
# every token in flight on the estate at once, which is why the two had to stop sharing a key.
#
# Unset, this falls back to qits.idp.url, which is what it was before the split. DO NOT RE-MERGE
# THEM: they read identically on a platform that has not cut over, and that is precisely how they
# would get collapsed back into one.
qits.idp.dial-url=${QITS_IDP_DIAL_URL:http://${QITS_ENVIRONMENT:dev}-qits-platform-idp:8080/idp}

# TOKENS ARE CHECKED OFFLINE, against the keys fetched from qits.idp.url/jwks and cached. idp is
# overlay-only — a `docker login` client on the host cannot reach it — and keeping it off the
# per-pull path is worth more than the freshness a call-out would buy. An unknown `kid` buys ONE
# refresh, behind the cooldown below.
# qits.edge.auth.jwks-refresh-cooldown-ms=5000
# qits.edge.auth.clock-skew-seconds=30

# The permission. The platform's claim model has no registry scope and needs none: the audience the
# token already carries IS the gate, and docker's own `scope` parameter is read and dropped rather
# than being given a meaning this process would then have to enforce.
#
# `{env}` IS THE BOUNDARY BETWEEN TIERS, and it is the same placeholder as the host patterns above:
# the demanded audience is resolved per request from the environment the vhost named. idp's audience
# values are env-prefixed, so a token minted for dev's registry does not open prod's vhost — one
# entry, and neither tier can unlock the other.
#
# A value with no placeholder is a literal and still works, which is what a single-audience
# deployment wants.
#
# THE SHIPPED DEFAULT IS THE LITERAL `qits-platform` — the same string as the platform audience
# below — so a freshly configured vhost opens with roles alone rather than a tier-scoped audience,
# which is the open calling model's own rule (service-client-identity-plan.md). The same default
# ships on `qits.edge.apps.<app>.audience-pattern`, so `acceptedAudiences` names ONE audience rather
# than two once neither is overridden. An EXPLICITLY CONFIGURED pattern still wins and still works
# unchanged — this is what the githost and editor entries' own resource-audience extras rely on:
#
#   QITS_EDGE_AUTH_AUDIENCE_PATTERN={env}-qits-artifacts
#   QITS_EDGE_APPS_GITHOST_AUDIENCE_PATTERN={env}-qits-githost
#
# qits.edge.auth.audience-pattern=qits-platform

# ONE AUDIENCE OPENS EVERY VHOST: the platform audience. A person's command-line tool gets a token
# for it, and that token must reach every qits service. A token passes when its `aud` names the
# vhost's own audience OR this one. Every other check stays.
#
# NO `{env}`, on purpose. This audience only says "this token is for this platform". The token's
# roles are the permission, and each service checks them: roles, not tiers, are the permission system.
#
# An empty value switches the rule off. Then only the vhost's own audience opens it.
# qits.edge.auth.platform-audience=qits-platform

# --- HTTP BASIC, for the clients that cannot do docker's dance -------------------------------------
# maven, npm and git send `Authorization: Basic` and nothing else — none of them reads a Bearer
# challenge, fetches a token and retries. So a gated request carrying Basic is validated the only way
# a client id and secret can be: it is spent at idp, exactly as /token does, and the token that comes
# back is then checked like one the caller had presented — same issuer, same exp, same signature,
# same demanded audience.
#
# THE RESULT IS CACHED AGAINST A HASH OF THE CREDENTIAL, never the credential, for the SHORTER of the
# minted token's life and the ceiling below. A Basic client resends its credential on every request —
# that is what makes it a Basic client — so without this every dependency fetch would put an idp
# round trip on the path, which is the thing offline validation exists to avoid. What is cached is
# the credential's own soundness plus the audiences it carried; the demanded audience is still
# answered per request, so one cached validation cannot cross tiers. Refusals are NOT cached: a
# rotated secret must start working the moment it is right.
# qits.edge.auth.basic-cache-ttl-ms=300000
# qits.edge.auth.basic-cache-size=1024

# --- OPAQUE TOKENS, introspected per request ------------------------------------------------------
# A `qits_tok_…` value — as a Bearer, or as the password of a Basic pair (git's `oauth2:<token>`,
# `docker login -u token -p qits_tok_…`, any user at all) — is a row at idp, not a JWT. The edge asks
# idp's /api/tokens/introspect about it with its OWN client (QITS_EDGE_SESSIONS_CLIENT_ID and
# _SECRET, the pair browser sessions are introspected with), receives the ordinary JWT it stands for,
# checks that JWT like any Bearer and forwards IT upstream. No such client: every token is refused,
# with one WARN at startup. idp unreachable: 503, never a pass.
#
# idp's answer is cached against a HASH of the token, for the SHORTER of the minted JWT's life and
# the ceiling below — and REFUSALS ARE CACHED TOO, for the whole ceiling: a revoked token left in a CI
# config must not become an idp round trip per request. So the TTL is THE UPPER BOUND ON A REVOKED
# TOKEN'S AFTERLIFE AT THE EDGE, and a token idp would accept again is believed again within it.
# Env: QITS_EDGE_AUTH_TOKEN_CACHE_TTL_MS / QITS_EDGE_AUTH_TOKEN_CACHE_SIZE.
# qits.edge.auth.token-cache-ttl-ms=15000
# qits.edge.auth.token-cache-size=1024

# --- AN IDENTITY PROVIDER THAT IS NOT THERE ---------------------------------------------------------
# idp is a container like any other and is redeployed like any other: for a few seconds its name
# refuses, drops, or accepts a connection and never answers. On 2026-08-14 a deploy push died with
# "the identity provider could not be reached" for landing inside that window.
#
# So every dial at idp — the /token broker, the Basic validation, the JWKS fetch — is bounded per
# attempt by the call timeout and retried on connection-classed failures until the window runs out.
# An ANSWER from idp is never retried: a 401 is idp deciding, and repeating the question would turn
# one refusal into a burst of them.
# qits.edge.auth.idp-retry-window-ms=45000
#
# THE CALL TIMEOUT IS THE LOAD-BEARING HALF. A Vert.x client is built with no request timeout and no
# idle timeout, so an idp that accepts a connection and then says nothing leaves the call outstanding
# with nothing to end it — no status, no body, until quarkus.http.idle-timeout closes the inbound
# connection an hour later. A docker client has no timeout of its own on a realm call, so from the
# outside that is a `docker push` that HANGS rather than fails.
# qits.edge.auth.idp-call-timeout-ms=5000

# --- THE ENFORCEMENT SWITCH ------------------------------------------------------------------------
# Service vhosts enforce from their first request. Every one of them fronts a service with no
# external auth of its own, and the environment vhost is the door: it serves nothing, so there is
# nothing to gate there and no second switch.
# qits.edge.auth.enforce-on-apps=true

# --- THE ONE GAP IN A GATED VHOST: anonymous reads, per app ----------------------------------------
# A list of APP LABELS — the `$app` of $app.$env.$domain — whose GET and HEAD are served to anyone.
# Every other method on those same names still needs a valid token, so this opens reads and never a
# service.
#
# THE READS ARE THE BOOTSTRAP STEPS. Pulling a base image onto a fresh node, cloning a repository,
# fetching a dependency from the mirror — each happens BEFORE there is anything to hold a token, and
# each is the thing a gated registry vhost breaks first. A push, a tag delete, a receive-pack is
# never a bootstrap step, so it keeps the whole check.
#
# EMPTY HERE, and empty is the shipped default: a name in this file would be a read no deployment
# could close again. A deployment names its own, without a file:
#
#   QITS_EDGE_AUTH_ANONYMOUS_READ_APPS=registry,mirror
#
# It reaches SERVICE vhosts only — a configured app label or a name a deployment published — and a
# label nothing claims is still a 404 rather than an open door.
# qits.edge.auth.anonymous-read-apps=

# --- BROWSER SESSIONS: the other half, and it ships DARK --------------------------------------------
# Everything above gates MACHINES. A person carries neither a token nor a client secret, so the
# names a browser types gate a `qits-session` cookie instead: it is introspected at idp and becomes
# X-Qits-User / X-Qits-User-Id / X-Qits-Roles, the headers every service already trusts. Those names
# are the service hosts — a machine credential still takes the machine path there, and still arrives
# with the cookie removed. The door gates nothing, because it serves nothing.
#
# OFF, AND FLIPPING IT IS A STEP OF ITS OWN. The gate lands before idp can issue a session and before
# the environment gateway reads the headers, so it ships inert: with this false, a request takes the
# path it took before the gate existed. Turn it on only after idp's login page is live, and before the
# gateway's own no-auth `local` variant retires — the order is in user-authentication-plan.md, and it
# matters both ways.
# qits.edge.sessions.enabled=false
#
# The cookie name, the login page and the anonymous carve-out are a CONTRACT with qits-platform-idp
# and its SPA rather than a deployment's choice, so the defaults are the values and no deployment
# should need to write them. `/idp/` is one prefix on purpose: the pages need their SPA assets, the
# protocol endpoints authenticate their own callers, and an asset-path list would drift the first time
# a bundle is renamed.
#
# THE LOGIN PAGE LIVES ON THE HOST OF WHOEVER OWNS THE LOGIN PATH — idp publishes `idp`, so it is
# https://idp.example.com/idp/login. The path is configured; the origin is read off the deployment
# projection per request, and falls back to the canonical origin below while no deployment has
# published a host for it. idp is a platform service deployed once, so an environment that owns no
# route for the path asks the default environment before falling back.
#
# THE PREFIXES ARE ANONYMOUS ON THAT HOST, nowhere else. Serving them everywhere would open one
# service's routes on every name; refusing them on idp's own name would redirect the login page to
# itself forever.
# qits.edge.sessions.cookie-name=qits-session
# qits.edge.sessions.login-path=/idp/login
# qits.edge.sessions.anonymous-prefixes=/idp/
#
# THE NAMES A LOGIN MAY RETURN TO ARE DERIVED, NOT CONFIGURED. There is no key: the allow-list is
# the stated domain (qits.edge.domain, on the canonical origin's port) plus ONE wildcard in front of
# it, admitting up to three labels. Three is the grammar's own depth —
# <app>[.<env>].<project>.<domain> — so that one wildcard
# covers every project's door, every environment's door and every application of either, with no
# knowledge of the live project set. A list had to be kept in step with that set and was not: on the
# platform it still named the pre-project-tier shape, and projects.qits.wohlben.eu could not be
# returned to.
#
# WHAT KEEPS THAT SAFE IS THE DOMAIN ANCHOR, not the label count. The check exists to stop a login
# returning to a FOREIGN origin, and every name admitted is under the domain this deployment states.
# The depth is bounded anyway so a return host is still a name the grammar could have produced, and
# so that <domain>.evil.example — which a suffix test would accept — is refused.
#
# THE CANONICAL ORIGIN IS DERIVED AND HAS NO KEY. It is the PLATFORM PROJECT's own door —
# https://qits.<domain>, or http://qits.<domain>:8080 where the domain is not a real one — because
# that is the name a request inside no project falls back to and every platform application name is
# one label in front of. The apex is not it: the apex carries no project label, so it can compose no
# application address at all, and a refused login sent there lands on a 404. It was
# QITS_EDGE_SESSIONS_CANONICAL_ORIGIN, holding https://wohlben.eu on the platform, which is exactly
# that 404. It is not the login origin either — that comes from whoever publishes login-path's host,
# and this is only the fallback while nobody does.
#
# A SERVICE VHOST IS GATED PER REQUEST, not per plane: a machine credential first, then this cookie
# (kept, not stripped — the service behind the name is an ordinary qits service), then that app's
# anonymous reads, then the refusal a caller can act on — the login page for a navigation and the
# WWW-Authenticate challenge for everything else, which is what `docker pull` needs to see.
#
# THE CACHE, AND WHAT IT COSTS. Every request a browser makes carries the cookie, so without one every
# image and every poll would put an idp round trip on the path. The TTL is therefore also how long a
# logout or a revocation lingers — thirty seconds rather than the Basic cache's five minutes, because
# a person pressing "log out" expects the door to shut while they are still looking at it.
# qits.edge.sessions.cache-ttl-ms=30000
# qits.edge.sessions.cache-size=1024
#
# AND WHAT OUTLIVES A REDEPLOY. Same lesson as the retry window above, learnt on the token broker: idp
# is a container like any other, and for a few seconds its name refuses or never answers. A machine
# retries a push; a person is logged out mid-click. So a session idp has already vouched for keeps
# answering for this long while idp is UNREACHABLE — never when idp answers "no", which is a decision
# and is obeyed at once, and never past the session's own expiry.
# qits.edge.sessions.stale-grace-ms=60000
#
# THE EDGE'S OWN idp CLIENT, and it has no default because a credential is a deployment fact. The
# bootstrap seeds `{env}-qits-edge` and injects the pair; these two spellings are the contract:
#
#   QITS_EDGE_SESSIONS_CLIENT_ID=dev-qits-edge
#   QITS_EDGE_SESSIONS_CLIENT_SECRET=…
#
# Absent while the gate is off is the ordinary state. Absent while it is ON fails at STARTUP, because
# the alternative is an edge that refuses every browser for a reason only a stack trace holds.
#
# QITS_RESOURCE_IDP_CLIENT_ID and QITS_RESOURCE_IDP_CLIENT_SECRET are read FIRST — the `idp:client`
# resource a deployment may declare for this service (service-client-identity-plan.md, C4/D6/D7).
# The client id it names becomes `qits-platform-edge` at the edge's own cutover (D2); nothing else
# in this repository keys on the older `<env>-qits-edge` spelling. Neither pair set is what leaves
# the gate with no credential — the startup check above still fires unchanged.
qits.edge.sessions.client-id=${QITS_RESOURCE_IDP_CLIENT_ID:${QITS_EDGE_SESSIONS_CLIENT_ID}}
qits.edge.sessions.client-secret=${QITS_RESOURCE_IDP_CLIENT_SECRET:${QITS_EDGE_SESSIONS_CLIENT_SECRET}}

# --- TLS certificate ownership --------------------------------------------------------------------
# DNS-01 is off in a clone and on only when a deployment supplies the mode and the provider token.
# The edge then owns issuance and renewal; Quarkus owns serving and hot-reloading the PEMs.
# Wildcards cannot use HTTP-01, so the old unauthenticated challenge-management interface is gone.
#
# THE DOMAIN IS NOT A KEY HERE. It was qits.edge.acme.domain, which was the platform's one stated
# domain under a second name and a value a deployment could set to something the router disagreed
# with. The certificate is ordered for qits.edge.domain (QITS_DOMAIN) — the same value, normalised
# the same way, that every served name is read against.
qits.edge.acme.enabled=false
qits.edge.acme.mode=off
qits.edge.acme.hetzner-token=${QITS_DNS_HETZNER_TOKEN:}
#
# THE DERIVED SET IS FOUR TIERS, because a wildcard covers exactly ONE label: the apex and
# *.<domain>; *.<env>.<domain> per environment; *.<project>.<domain> per project; and
# *.<project>.<env>.<domain> for both. The LAST is the web editor's own origin,
# editor.<project>.<env>.<domain> — a middle label that is a PROJECT, which no environment wildcard
# reaches.
#
# THE THIRD TIER IS A NAME THAT IS NOT SERVED, and it is kept deliberately.
# editor.<project>.<domain> states no environment, so the router answers it 404 with the explicit
# spelling — but the TLS handshake happens before any answer, so without this tier a caller still
# dialling the retired short name gets a certificate error instead of a sentence telling them what
# to type. One SAN per project buys a readable 404.
#
# THE PROJECTS ARE NOT CONFIGURED HERE. They arrive as qits-projects' ProjectCreated/ProjectDeleted
# events and live in the edge_project projection, so a project created today is covered today. A
# create requests a debounced reconcile (below); a delete orders nothing, because every name on the
# installed certificate still answers and the surplus wildcard ages out at the next renewal.
#
# HOW LONG A REQUESTED RECONCILE WAITS for the frames behind it. Epoch replay delivers every
# ProjectCreated ever published in one burst, and an order per frame would spend Let's Encrypt's
# five duplicate certificates a week in seconds. Thirty seconds is the default and there is no
# bootstrap key for it; it is here for an operator who has a reason.
# qits.edge.acme.reconcile-debounce=PT30S
#
# THE NAMES NO TIER REACHES, still spelled out one per line, whole or relative to the domain:
#
#   QITS_EDGE_ACME_ADDITIONAL_NAMES=editor.acme,editor.gizmo.wohlben.eu
#
# It is a list of NAMES and knows nothing about projects. Absent orders exactly the derived set; a
# name added reaches the certificate at the next order, which the 12h reconcile does on its own and
# a restart does at once.
#
# A CERTIFICATE CARRIES AT MOST 100 NAMES. Past that Let's Encrypt refuses the order rather than
# trimming it, so CertificateNames trims first: whole PROJECT tiers are dropped, from the end of the
# slugs' sorted order, until the set fits, and the manager logs an ERROR naming every dropped slug
# on every reconcile while any are dropped. It warns at 90, before any of that. The arithmetic is
# 2 + E + P + P*E + A, and the term that grows on its own — without anybody deciding to — is P*E,
# which is why it is the one that gives way. The apex, the environment tiers and the additional
# names are never dropped; when THEY alone exceed 100 the derivation still refuses, because that is
# a deployment to correct rather than a projection that grew.
# qits.edge.acme.additional-names=

# acme4j generates and persists EC account/certificate keys through Bouncy Castle. GraalVM does
# not retain named JCE providers merely because their jars are present, so make BC part of the
# native image as well as the JVM runtime.
quarkus.security.security-providers=BC

# --- telemetry --------------------------------------------------------------------------------
# One key names the receiver: qits.observability.url — scheme, host and port, NO path, the same
# shape as in qits-gateway. The ingest path is qits-observability's own and belongs to the service,
# not to the deployment, so it is spelled once here and derived rather than configured. Point this
# at a collector or a different host and everything below follows.
#
# The bare name is the default a deployment overrides: a deployer injects the address the edge can
# actually reach, and this value is what a clone-alone build and a reader see.
qits.observability.url=http://${QITS_ENVIRONMENT:dev}-qits-observability:8080

# http/protobuf, not the gRPC default: the receiver is OtelReceiverResource over HTTP, and the
# exporter appends /v1/<signal> to this base — so this resolves to the three ingest routes at
# /observability/api/otel/v1/{traces,logs,metrics}.
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.exporter.otlp.endpoint=${qits.observability.url}/observability/api/otel

# Logs ride the same exporter; traces are on by default. The receiver decodes all three signals, and
# a log record correlated to a trace is most of why the receiver exists. It matters more here than
# anywhere: the edge is the outermost hop, so a request it answered itself — a 502 against an
# unreachable gateway, a host name that fell to the default — exists in no other process' telemetry.
#
# THE THREE KEYS BELOW ARE SPELLED OUT ON PURPOSE. Quarkus still labels its OpenTelemetry logging
# integration PREVIEW, and the whole of what ships application logs to qits-observability is the
# handler this enables — so an upgrade that changed one of these defaults would stop the platform's
# logging with a green build and no error anywhere. Written down, a change of default is a diff
# rather than a silence. Measured against Quarkus 3.34.6's own config classes rather than recalled:
#
#   quarkus.otel.logs.handler.enabled  default true  (LogsRuntimeConfig.handlerEnabled)
#   quarkus.otel.logs.exporter         default cdi   (LogsBuildConfig.exporter)
#   quarkus.otel.logs.level            default ALL   (LogsRuntimeConfig.level)
#
# `cdi` is what routes the records at the exporter configured above rather than at a second,
# separately-configured one; `handler.enabled` is the JBoss Log Manager handler that turns an
# ordinary org.jboss.logging.Logger call into an OTLP record, and without it the other two keys
# describe a pipe nothing enters.
#
# The level is the ONE line here that is not the shipped default: Quarkus exports every record the
# log manager creates, and this makes INFO the outbound floor. Per-category quarkus.log levels still
# decide which records exist at all; this is a second gate on the way out. Console logging is
# untouched by all of it — the OTel handler is an ADDITIONAL copy, never the only one, which is what
# keeps a container's stdout the durable-at-host fallback when the receiver is down.
#
# qits-events' OtelLogBridgeTest proves this arrangement end to end against a decoded
# ExportLogsServiceRequest, and its PackagedLogBridgeIT repeats it against the packaged artifact.
# That proof is the platform's, not one per repository: the extension and the Quarkus pin are
# identical here. What this repo keeps is OtelLogConfigTest, which pins these four values and the
# exporter's endpoint so drift cannot disable log export quietly.
quarkus.otel.logs.enabled=true
quarkus.otel.logs.handler.enabled=true
quarkus.otel.logs.exporter=cdi
quarkus.otel.logs.level=INFO

# Metrics ride it too. Off by default in Quarkus, so without this line the third signal never
# leaves — the receiver has always decoded it, and the observability UI has nothing to plot until
# every service says this.
quarkus.otel.metrics.enabled=true

# Dark outside a deployment. A clone-alone `./mvnw verify` and a `quarkus:dev` have no
# qits-observability to reach, and an exporter retrying against an unresolvable host turns every
# suite into a wall of export failures. The deployment is where telemetry is real.
%dev.quarkus.otel.sdk.disabled=true
%test.quarkus.otel.sdk.disabled=true

quarkus.log.level=INFO
quarkus.log.category."eu.wohlben.qits.edge".level=INFO
quarkus.banner.enabled=false

# Name the compiled artifact `qits-platform-edge` (not …-<version>-runner), so `-Dnative` produces
# target/qits-platform-edge directly and the process is identifiable in `ps` / `docker top`.
quarkus.package.output-name=qits-platform-edge
quarkus.package.jar.add-runner-suffix=false
