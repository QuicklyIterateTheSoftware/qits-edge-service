# Test config. The environment list and the stub gateways' addresses are injected by StubGateways
# at start, because their ports are ephemeral and unknown until they bind.

# A FREE PORT, NOT 8081. On the deployment host 8081 is the platform's own npm registry, so the
# Quarkus default would make the whole suite fail with a bind error that looks like a flake. 0 lets
# the kernel choose and RestAssured follows.
quarkus.http.test-port=0
# The same for HTTPS. The story ITs launch the %prod artifact, which serves TLS from the image's own
# PEM defaults (qits-2009), and the Quarkus default test-ssl-port 8444 is a fixed host port too.
quarkus.http.test-ssl-port=0

# NO DOCKER AND NO NETWORK: `./mvnw verify` must run from a clone of this repo alone. The upstreams
# are in-process stub servers on loopback; nothing here starts a container or resolves a name.
quarkus.devservices.enabled=false

# The projection and the durable bus claim ledger each own their database and Flyway lineage. The
# test ConfigSource supplies their ephemeral URLs; clean-at-start makes one boot reproducible.
quarkus.flyway.edge.clean-at-start=true
quarkus.flyway.eventstream.clean-at-start=true
qits.eventstream.enabled=false
qits.eventstream.catchup-at-startup=false
# The regular edge integration tests intentionally have no qits-events server. Their direct calls
# to DeploymentActiveSubscriber test routing itself, so they opt out of the production startup
# barrier. EdgeRoutingTest covers the barrier with a historical log.
qits.edge.projection.catchup.required=false
quarkus.scheduler.enabled=false

quarkus.log.category."eu.wohlben.qits.edge".level=DEBUG

# THE USERFLOWS CLASS ORDERER, INSTALLED THE ONE WAY QUARKUS PERMITS. quarkus-junit ships its own
# junit-platform.properties with a ClassOrderer that groups tests by @TestProfile (so a profile's
# application isn't torn down under a class still running), and surefire HARD-FAILS if a local
# junit-platform.properties overrides it. The blessed seam is the secondary orderer, which breaks
# ties INSIDE a profile group — story classes sharing a profile still run in topological
# @UserflowPrecondition order, and the ordinary test classes (no story annotations) are untouched.
# The framework's registries are per-JVM: keep the single sequential test JVM (surefire/failsafe
# default forkCount=1); do not enable parallel execution. Note this module runs surefire TWICE, in
# two JVMs — see pom.xml — and that is orthogonal: neither execution holds a story class.
#
# One story class is all this repository has today (ForwardAuthBootstrapIT), and its two stories are
# independent of each other's order by construction: each asserts on request paths of its own, and
# the one count it takes (idp introspections) is a delta rather than an absolute. It is spelled
# anyway because the failure it prevents is silent: a second story class added later would run in
# JUnit's own order and a @UserflowPrecondition would be skipped rather than reported.
#
# THIS FILE IS ON THE TEST JVM'S CLASSPATH, NOT IN THE LAUNCHED ARTIFACT. Everything above it is
# read by the @QuarkusTest suites; ForwardAuthBootstrapIT hands the launched process its whole
# configuration through its own @TestProfile, as -D arguments on an already-built artifact — which
# is why the gate it turns on (qits.edge.sessions.enabled) appears there and not here.
junit.quarkus.orderer.secondary-orderer=eu.wohlben.qits.userflows.UserflowClassOrderer
